[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmux"
version = "0.1.0"
description = "A neutral, BYOK search provider router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
webmux-api = "webmux.cli:api_main"
webmux-keygen = "webmux.cli:keygen_main"
webmux-benchmark = "webmux.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webmux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]
